<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Details | BorrowBuddy</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f8fafc;
            color: #172033;
        }

        header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            color: #2563eb;
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: #475569;
            font-size: 14px;
        }

        .login {
            border: 1px solid #2563eb;
            color: #2563eb;
            padding: 9px 16px;
            border-radius: 8px;
        }

        .signup {
            background: #2563eb;
            color: white !important;
            padding: 10px 16px;
            border-radius: 8px;
        }

        .back {
            display: block;
            max-width: 1100px;
            margin: 30px auto 0;
            padding: 0 7%;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
        }

        .details-container {
            max-width: 1100px;
            margin: 25px auto 80px;
            padding: 0 7%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 45px;
        }

        .item-photo {
            height: 430px;
            background: #e2e8f0;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 100px;
        }

        .category {
            color: #2563eb;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .item-info h1 {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .rating {
            margin-bottom: 20px;
        }

        .location {
            color: #64748b;
            margin-bottom: 22px;
        }

        .description {
            color: #475569;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .info-box {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 22px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 9px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .label {
            color: #64748b;
        }

        .value {
            font-weight: 600;
        }

        .owner {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 22px;
        }

        .owner-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #dbeafe;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #2563eb;
        }

        .owner p {
            color: #64748b;
            font-size: 13px;
            margin-top: 4px;
        }

        .request-btn {
            width: 100%;
            padding: 15px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 9px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .request-btn:hover {
            background: #1d4ed8;
        }

        footer {
            background: #172033;
            color: white;
            text-align: center;
            padding: 40px 7%;
        }

        footer p {
            color: #94a3b8;
            margin-top: 10px;
            font-size: 14px;
        }

        @media (max-width: 750px) {
            nav {
                display: none;
            }

            .details-container {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .item-photo {
                height: 300px;
            }

            .item-info h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html" class="logo">BorrowBuddy</a>

    <nav>
        <a href="index.html">Home</a>
        <a href="browse.html">Browse</a>
        <a href="#">How It Works</a>
        <a href="#" class="login">Login</a>
        <a href="#" class="signup">Sign Up</a>
    </nav>
</header>

<a href="browse.html" class="back">← Back to Browse</a>

<main class="details-container">

    <div class="item-photo" id="itemPhoto"></div>

    <div class="item-info">

        <div class="category" id="itemCategory"></div>

        <h1 id="itemName"></h1>

        <div class="rating" id="itemRating"></div>

        <div class="location" id="itemLocation"></div>

        <p class="description" id="itemDescription"></p>

        <div class="info-box">

            <div class="info-row">
                <span class="label">Condition</span>
                <span class="value" id="itemCondition"></span>
            </div>

            <div class="info-row">
                <span class="label">Availability</span>
                <span class="value" id="itemAvailability"></span>
            </div>

            <div class="info-row">
                <span class="label">Borrowing</span>
                <span class="value" id="itemPrice"></span>
            </div>

        </div>

        <div class="owner">

            <div class="owner-avatar" id="ownerAvatar"></div>

            <div>
                <strong id="ownerName"></strong>
                <p id="ownerRating"></p>
            </div>

        </div>

        <button class="request-btn" onclick="requestBorrow()">
            Request to Borrow
        </button>

    </div>

</main>

<footer>
    <h2>BorrowBuddy</h2>
    <p>Borrow what you need. Share what you don't.</p>
    <p>© 2026 BorrowBuddy. All rights reserved.</p>
</footer>

<script>

    const item = items[id] || items[1];

    document.getElementById("itemPhoto").textContent = item.photo;
    document.getElementById("itemCategory").textContent = item.category;
    document.getElementById("itemName").textContent = item.name;
    document.getElementById("itemRating").textContent = item.rating;
    document.getElementById("itemLocation").textContent = item.location;
    document.getElementById("itemDescription").textContent = item.description;
    document.getElementById("itemCondition").textContent = item.condition;
    document.getElementById("itemAvailability").textContent = item.availability;
    document.getElementById("itemPrice").textContent = item.price;
    document.getElementById("ownerAvatar").textContent = item.owner.charAt(0);
    document.getElementById("ownerName").textContent = item.owner;
    document.getElementById("ownerRating").textContent = item.ownerRating;

    function requestBorrow() {

</body>
</html>
